<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Wiring TV</title>
  <style>
    body {
      background-color: #1a1a1a;
      color: #00ff00;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      margin: 0;
      overflow: hidden;
      min-height: 100vh;
      cursor: default;
    }

    /* Outer TV casing */
    .tv-box {
      position: relative;
      width: 95vw;
      height: 95vh;
      max-width: 1000px;
      max-height: 750px;
      aspect-ratio: 4 / 3;
      background: #2a2a2a;
      border: 8px solid #111;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.7) inset;
      display: flex;
      flex-direction: column; /* Main flex direction for TV content */
      align-items: center;
      justify-content: space-between;
      padding: 30px;
      box-sizing: border-box;
      overflow: hidden;
      margin: auto;
      z-index: 1; /* Ensures it's below SVG cables but above background */
    }

    /* Ambient glow effect (outside the TV) */
    .tv-box::before, .tv-box::after, .tv-box .side-glow-left, .tv-box .side-glow-right {
        content: '';
        position: absolute;
        pointer-events: none;
        z-index: 0; /* Ensures it's behind the TV box content */
        background: radial-gradient(circle at center, rgba(0, 255, 0, 0.18) 0%, transparent 70%); /* Stronger initial glow */
        filter: blur(70px); /* More blur for wider spread */
        animation: ambient-glow 3s ease-in-out infinite alternate; /* Sync with screen glow */
    }

    .tv-box::before { /* Top glow */
        top: -15%; /* Position further above */
        left: 50%;
        transform: translateX(-50%);
        width: 110%; /* Wider than screen */
        height: 60%; /* Taller */
    }

    .tv-box::after { /* Bottom glow */
        bottom: -15%;
        left: 50%;
        transform: translateX(-50%);
        width: 110%;
        height: 60%;
    }

    .tv-box .side-glow-left { /* Left glow */
        left: -15%;
        top: 50%;
        transform: translateY(-50%);
        width: 60%;
        height: 100%;
        background: radial-gradient(circle at center, rgba(0, 255, 0, 0.18) 0%, transparent 70%);
        filter: blur(70px);
        animation: ambient-glow 3s ease-in-out infinite alternate;
    }

    .tv-box .side-glow-right { /* Right glow */
        right: -15%;
        top: 50%;
        transform: translateY(-50%);
        width: 60%;
        height: 100%;
        background: radial-gradient(circle at center, rgba(0, 255, 0, 0.18) 0%, transparent 70%);
        filter: blur(70px);
        animation: ambient-glow 3s ease-in-out infinite alternate;
    }


    @keyframes ambient-glow {
        0% { opacity: 0.8; }
        50% { opacity: 1; }
        100% { opacity: 0.8; }
    }


    /* Top section of the TV: screen and knobs side-by-side */
    .tv-top-section {
      display: flex;
      width: 100%;
      flex-grow: 1; /* Allow to take available height */
      align-items: flex-start; /* Align screen and knobs to the top */
      gap: 20px; /* Space between screen and knobs */
      margin-bottom: 10px; /* Reduced space above bottom panel */
    }

    /* Inner screen container - for bezel and curvature */
    .screen-container {
      position: relative;
      flex-grow: 1; /* Screen takes most horizontal space */
      height: 100%; /* Take full height of tv-top-section */
      min-height: 150px;
      background: #0d0d0d;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.8) inset;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 2px solid #070707;
      z-index: 5;
    }

    /* Actual display area */
    #screenText {
      position: relative;
      font-size: clamp(0.7rem, 2vw, 1.6rem);
      text-align: center;
      width: 95%;
      height: 95%;
      display: flex;
      flex-direction: column; /* Allow content to stack */
      align-items: center;
      justify-content: center;
      background-color: #011d01;
      border-radius: 8px;
      color: #00ff00;
      transition: all 0.2s ease;
      border-radius: 50% / 10%;
      /* Enhanced Glow */
      box-shadow: 0 0 45px rgba(0, 255, 0, 0.9), /* Brighter, larger initial glow */
                  inset 0 0 60px rgba(0, 255, 0, 0.3), /* Enhanced inner glow */
                  inset 0 0 15px rgba(0, 0, 0, 0.9);
      animation: flicker 0.1s infinite alternate, glow-breathe 3s ease-in-out infinite alternate;
      padding: 10px;
      box-sizing: border-box;
      z-index: 10;
      transform: perspective(1000px) rotateX(2deg);
    }

    #screenText.glitch-active {
      animation: glitch 0.2s linear 2, flicker 0.1s infinite alternate;
    }

    #screenText.dimmed {
      box-shadow: 0 0 15px rgba(0, 255, 0, 0.4),
                  inset 0 0 20px rgba(0, 255, 0, 0.1),
                  inset 0 0 15px rgba(0, 0, 0, 0.9);
      animation: none;
    }

    /* Scanline effect */
    #screenText::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.15),
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 1;
    }

    /* Screen vignette effect */
    #screenText::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.7);
      border-radius: 50% / 10%;
      pointer-events: none;
      z-index: 2;
    }

    @keyframes glitch {
      0% { transform: translate(0); opacity: 1; }
      25% { transform: translate(-2px, 2px); opacity: 0.8; }
      50% { transform: translate(2px, -2px); opacity: 1; }
      75% { transform: translate(-1px, 1px); opacity: 0.9; }
      100% { transform: translate(1px, -1px); opacity: 1; }
    }

    @keyframes flicker {
      0% { opacity: 1; }
      50% { opacity: 0.98; }
      100% { opacity: 1; }
    }

    @keyframes glow-breathe {
      0% { box-shadow: 0 0 45px rgba(0, 255, 0, 0.9), inset 0 0 60px rgba(0, 255, 0, 0.3), inset 0 0 15px rgba(0, 0, 0, 0.9); }
      50% { box-shadow: 0 0 60px rgba(0, 255, 0, 1), inset 0 0 80px rgba(0, 255, 0, 0.4), inset 0 0 15px rgba(0, 0, 0, 0.9); }
      100% { box-shadow: 0 0 45px rgba(0, 255, 0, 0.9), inset 0 0 60px rgba(0, 255, 0, 0.3), inset 0 0 15px rgba(0, 0, 0, 0.9); }
    }

    /* Knob container for functional knobs */
    .tv-knobs-container {
      display: flex;
      flex-direction: column;
      gap: 15px; /* Adjusted gap for new knob */
      align-items: center;
      flex-shrink: 0;
      margin-top: 10px;
    }

    .knob-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .tv-knob {
      width: clamp(35px, 5vw, 45px);
      height: clamp(35px, 5vw, 45px);
      border-radius: 50%;
      background: linear-gradient(to bottom right, #555, #222);
      border: 2px solid #111;
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.7), 0 2px 5px rgba(0, 0, 0, 0.5);
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.1s ease-out, box-shadow 0.1s ease-out;
    }
    .tv-knob:active {
      transform: translateY(2px);
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.9), 0 1px 2px rgba(0, 0, 0, 0.5);
    }

    .tv-knob::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(45deg);
      width: clamp(7px, 1.2vw, 9px);
      height: clamp(14px, 2.2vw, 18px);
      background-color: #888;
      border-radius: 2px;
      box-shadow: 0 0 3px rgba(255, 255, 255, 0.3);
    }

    .knob-label {
      color: #00cc00;
      font-size: clamp(0.7rem, 1.2vw, 0.9rem);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: center;
      background-color: rgba(0, 0, 0, 0.5);
      padding: 3px 8px;
      border-radius: 3px;
      box-shadow: inset 0 0 3px rgba(0, 0, 0, 0.7);
    }

    /* Main bottom panel container for I/O - changed to column layout */
    .tv-main-panel {
      display: flex;
      flex-direction: column;
      width: 100%;
      flex-shrink: 0;
      align-items: flex-start;
      margin-top: 10px;
    }

    /* Container for the combined Output and Input areas */
    .io-panel-wrapper {
        display: flex;
        flex-direction: column;
        position: relative;
        background-color: transparent;
        border: none;
        border-radius: 0;
        box-shadow: none;
        padding: 0;
        box-sizing: border-box;
        gap: 0;
    }

    /* Output and Input Row containers */
    .output-row-container, .input-row-container {
        display: flex;
        justify-content: center;
        align-items: stretch;
        width: 100%;
        padding: 0;
        box-sizing: border-box;
        gap: 5px;
    }

    /* Shared background for output sections */
    .output-sections-bg {
        background-color: rgba(13, 13, 13, 1);
        border: 1px solid #333;
        border-radius: 5px;
        box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.5);
        display: flex;
        justify-content: space-around;
        align-items: flex-start;
        gap: 0;
        padding: 5px 0;
        flex-grow: 1;
    }

    /* Shared background for input sections */
    .input-sections-bg {
        background-color: rgba(10, 10, 10, 1);
        border: 1px solid #333;
        border-radius: 50px;
        box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-grow: 1;
        flex-direction: column;
        align-items: center;
        padding: 5px 0;
    }

    /* Vertical Labels for I/O sections */
    .io-side-label {
        display: flex;
        flex-direction: column;
        justify-content: center; /* Vertically center text */
        align-items: center;
        color: #00cc00;
        font-size: clamp(0.8rem, 1.3vw, 1rem);
        font-weight: bold;
        letter-spacing: 1px;
        line-height: 1.1;
        border: 1px solid #333;
        border-radius: 3px;
        padding: 5px 3px;
        text-align: center;
        height: auto; /* Allow height to adjust */
        min-height: 50px; /* Ensure a minimum height if content is small */
        flex-shrink: 0;
        min-width: 30px;
        box-sizing: border-box;
        background-color: rgba(30, 30, 30, 0.8);
    }
    /* Explicitly align the OUTPUTS label to the height of the output-sections-bg */
    .output-row-container .io-side-label {
        align-self: stretch; /* Stretch to fill the height of its sibling (output-sections-bg) */
    }


    /* Individual Output Section styling */
    .output-section {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 0 4px;
      flex-shrink: 0;
      flex-grow: 1;
      min-width: 70px;
      flex-basis: auto;
      justify-content: center;
    }
    .output-section:not(:last-child) {
        border-right: 1px solid rgba(51, 51, 51, 0.5);
    }
    .output-section .section-label-text {
      color: #00cc00;
      font-size: clamp(0.7rem, 1vw, 0.9rem);
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: center;
      width: 100%;
    }
    .output-section .pins-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      align-items: center;
      width: 100%;
    }

    /* Input Area styling */
    .input-area-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex-grow: 1;
    }
    .input-area-content h3 {
      display: none;
    }

    /* INPUT PLUGS */
    .input-plugs-row {
      display: flex;
      justify-content: center;
      gap: 17px;
      align-items: center;
      width: 100%;
    }

    /* Common hole (port) styling */
    .hole {
      width: clamp(18px, 2.5vw, 22px);
      height: clamp(18px, 2.5vw, 22px);
      border: 2px solid #555;
      border-radius: 50%;
      background-color: #111;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      position: relative;
      flex-shrink: 0;
      box-sizing: border-box;
      box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.5), 0 0 3px rgba(0, 0, 0, 0.3);
    }
    .hole::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: clamp(7px, 1vw, 9px);
      height: clamp(7px, 1vw, 9px);
      border-radius: 50%;
      background-color: #333;
      border: 1px solid #000;
    }

    /* Specific styles for input pins */
    .hole.input-pin {
      border-color: #666;
    }

    /* Specific styles for output pins (now carry cable colors) */
    .hole.output-pin[data-cable="1"] { border-color: #D32F2F; }
    .hole.output-pin[data-cable="2"] { border-color: #1976D2; }
    .hole.output-pin[data-cable="3"] { border-color: #FBC02D; }

    .hole.selected {
      border-width: 3px;
      box-shadow: 0 0 15px currentColor;
    }
    .hole.connected {
      background-color: #00ff00;
      box-shadow: 0 0 10px #00ff00;
    }

    /* Class for the red flash effect (toggled by JS) */
    .hole.invalid-target-glow {
      background-color: #D32F2F !important;
      border-color: #FF0000 !important;
      box-shadow: 0 0 15px 5px rgba(255, 0, 0, 0.8), inset 0 0 10px rgba(255, 0, 0, 0.5) !important;
      transition: none;
    }

    svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 20;
    }

    /* Typing animation and cursor styles */
    #pressSpaceText {
        font-size: clamp(0.7rem, 1.5vw, 1.2rem);
        color: #00ff00;
        text-align: center;
        width: 100%;
        position: absolute;
        bottom: 10px;
        left: 0;
        right: 0;
        padding: 5px;
        box-sizing: border-box;
    }

    #pressSpaceText span.cursor {
        display: inline-block;
        width: 0.8ch;
        height: 1em;
        background-color: #00ff00;
        vertical-align: middle;
        margin-left: 2px;
        animation: blink 0.75s step-end infinite;
    }

    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
    }

    /* Loading text specific styles */
    #loadingTextContainer {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 10px;
        font-size: clamp(1rem, 2.5vw, 2rem);
        color: #00ff00;
    }
    #loadingPercentage {
        min-width: 4ch; /* Reserve space for 100% */
        text-align: left;
    }
    
    /* NEW Unified content styling */
    .content-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        text-align: center;
    }

    .content-title {
        font-size: clamp(1.5rem, 3.5vw, 2.8rem);
        font-weight: bold;
        margin-bottom: 5px;
    }
    .content-author {
        font-size: clamp(0.9rem, 2vw, 1.6rem);
        margin-bottom: 20px;
    }
    .content-subtitle {
        font-size: clamp(0.8rem, 1.5vw, 1.2rem);
        line-height: 1.4;
        text-align: left;
        width: 90%;
        margin: 0 auto;
        white-space: pre-wrap;
    }

    /* Unified text block for any regular text page */
    .content-text-block {
        font-size: clamp(0.8rem, 1.5vw, 1.2rem); /* Reduced font size */
        line-height: 1.4;
        text-align: left;
        width: 90%;
        margin: 0 auto;
        white-space: pre-wrap;
    }

    .content-text-block ul {
        list-style: none;
        padding: 0;
        margin-top: 10px;
        text-align: left;
        width: 90%;
        margin-left: auto;
        margin-right: auto;
    }
    .content-text-block ul li::before {
        content: '• ';
        color: #00ff00;
        font-weight: bold;
        display: inline-block;
        width: 1em;
        margin-left: -1em;
    }

    .content-text-block ol {
        list-style-type: decimal;
        padding-left: 25px; /* Indent the list */
        margin-top: 5px;
        text-align: left;
        width: 90%;
        margin-left: auto;
        margin-right: auto;
    }
    .content-text-block ol li {
        margin-bottom: 5px; /* Space between list items */
    }


    /* Styles for images within subsections */
    .subsection-image-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        /* FIXED: Removed height: 100% to allow container to size to its content */
        box-sizing: border-box;
        padding: 10px;
        overflow: hidden;
    }
    .subsection-image-container img {
        max-width: 90%;
        max-height: 75%;
        object-fit: contain;
        border: 1px solid #00ff00;
        box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
    }
    .subsection-image-container .image-caption {
        font-size: clamp(0.7rem, 1.2vw, 0.9rem);
        color: #00cc00;
        margin-top: 10px;
        text-align: center;
        width: 90%;
        white-space: pre-wrap;
    }

    /* Page index styling */
    #pageIndex {
        position: absolute;
        bottom: 10px;
        right: 10px;
        font-size: clamp(0.7rem, 1.2vw, 0.9rem);
        color: #00ff00;
        background-color: rgba(0, 0, 0, 0.5);
        padding: 3px 8px;
        border-radius: 3px;
        box-shadow: inset 0 0 3px rgba(0, 0, 0, 0.7);
        display: none; /* Hidden by default */
        z-index: 100; /* Ensure it's on top */
    }
  </style>
</head>
<body>
  <div class="tv-box">
    <div class="side-glow-left"></div>
    <div class="side-glow-right"></div>
    
    <div class="tv-top-section">
      <div class="screen-container" id="screenContainer">
        <div id="screenText" class="screen-text">
          <!-- All dynamic content will be injected here by JavaScript -->
        </div>
      </div>

      <div class="tv-knobs-container">
        <div class="knob-group">
          <div class="tv-knob" id="introKnob"></div>
          <div class="knob-label">INTRO</div>
        </div>
        <!-- ADDED: New knob for sections -->
        <div class="knob-group">
          <div class="tv-knob" id="sectionsKnob"></div>
          <div class="knob-label">SECTIONS</div>
        </div>
        <div class="knob-group">
          <div class="tv-knob" id="conclKnob"></div>
          <!-- UPDATED: Label text changed -->
          <div class="knob-label">CONCLUSION</div>
        </div>
        <div class="knob-group">
          <div class="tv-knob" id="unplugAllKnob"></div>
          <div class="knob-label">UNPLUG</div>
        </div>
        <div class="knob-group">
          <div class="tv-knob" id="sourcesKnob"></div>
          <div class="knob-label">SOURCES</div>
        </div>
      </div>
    </div>

    <div class="tv-main-panel">
      <div class="io-panel-wrapper" id="ioPanelWrapper">
        <div class="output-row-container">
          <div class="io-side-label">OUT<br>PUTS</div>
          <div class="output-sections-bg">
            <div class="output-section" data-label="SECTION1">
              <div class="section-label-text">SECTION 1</div>
              <div class="pins-row">
                <div class="hole output-pin" data-cable="1" data-index="1"></div>
                <div class="hole output-pin" data-cable="1" data-index="2"></div>
                <div class="hole output-pin" data-cable="1" data-index="3"></div>
                <div class="hole output-pin" data-cable="1" data-index="4"></div>
                <div class="hole output-pin" data-cable="1" data-index="5"></div>
              </div>
            </div>
            <div class="output-section" data-label="SECTION2">
              <div class="section-label-text">SECTION 2</div>
              <div class="pins-row">
                <div class="hole output-pin" data-cable="2" data-index="1"></div>
                <div class="hole output-pin" data-cable="2" data-index="2"></div>
                <div class="hole output-pin" data-cable="2" data-index="3"></div>
                <div class="hole output-pin" data-cable="2" data-index="4"></div>
                <div class="hole output-pin" data-cable="2" data-index="5"></div>
                <div class="hole output-pin" data-cable="2" data-index="6"></div>
              </div>
            </div>
            <div class="output-section" data-label="SECTION3">
              <div class="section-label-text">SECTION 3</div>
              <div class="pins-row">
                <div class="hole output-pin" data-cable="3" data-index="1"></div>
                <div class="hole output-pin" data-cable="3" data-index="2"></div>
                <div class="hole output-pin" data-cable="3" data-index="3"></div>
                <div class="hole output-pin" data-cable="3" data-index="4"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="input-row-container" id="inputRowContainer">
          <div class="io-side-label">IN<br>PUTS</div>
          <div class="input-sections-bg">
            <div class="input-area-content">
              <div class="input-plugs-row">
                <div class="hole input-pin" data-index="1"></div>
                <div class="hole input-pin" data-index="2"></div>
                <div class="hole input-pin" data-index="3"></div>
                <div class="hole input-pin" data-index="4"></div>
                <div class="hole input-pin" data-index="5"></div>
                <div class="hole input-pin" data-index="6"></div>
                <div class="hole input-pin" data-index="7"></div>
                <div class="hole input-pin" data-index="8"></div>
                <div class="hole input-pin" data-index="9"></div>
                <div class="hole input-pin" data-index="10"></div>
                <div class="hole input-pin" data-index="11"></div>
                <div class="hole input-pin" data-index="12"></div>
                <div class="hole input-pin" data-index="13"></div>
                <div class="hole input-pin" data-index="14"></div>
                <div class="hole input-pin" data-index="15"></div>
                <div class="hole input-pin" data-index="16"></div>
                <div class="hole input-pin" data-index="17"></div>
                <div class="hole input-pin" data-index="18"></div>
              </div>

            let currentContentArray = [];
